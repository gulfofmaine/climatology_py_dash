kind: Deployment
apiVersion: apps/v1
metadata:
  name: climatology
  labels:
    app: climatology
spec:
  replicas: 1
  selector:
    matchLabels:
      app: climatology
  template:
    metadata:
      labels:
        app: climatology
    spec:
      containers:
        - name: climatology
          image: gmri/neracoos-climatology-py-dash
          ports:
            - containerPort: 8080
              name: http
          env:
            # A DSN is not secret in the cryptographic sense -- the browser
            # feedback widget publishes the same value in every page. The
            # Secret keeps it out of git and away from gitleaks, nothing more.
            # `optional: true` means the pod still starts if the Secret does
            # not exist yet; the app treats an unset SENTRY_DSN as "off".
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: climatology-sentry
                  key: dsn
                  optional: true
            - name: SENTRY_ENVIRONMENT
              value: production
            - name: SENTRY_TRACES_SAMPLE_RATE
              value: "0.2"
          livenessProbe:
            httpGet:
              port: http
              path: /health
            # If it fails 3 times in 30 seconds, it will be killed
            failureThreshold: 3
            periodSeconds: 10
          # Without this the Service sends traffic to the pod as soon as it has
          # an IP. The startup probe only gates the liveness check, so during a
          # restart requests can arrive before the app answers them.
          readinessProbe:
            httpGet:
              port: http
              path: /health
            failureThreshold: 3
            periodSeconds: 10
          startupProbe:
            httpGet:
              port: http
              path: /health
            # If it fails 30 times in 300 seconds upon startup, it will be killed
            failureThreshold: 30
            periodSeconds: 10
