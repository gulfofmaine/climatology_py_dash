[project]
name = "climatology-py-dash"
version = "0.1.0"
description = "Add a short description here"
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "tadc @ git+https://github.com/NOAA-CO-OPS/CO-OPS-Tidal-Analysis-Datum-Calculator.git@v2.2.0?rev_type=tag",
]

[tool.pixi.dependencies]
erddapy = ">=3.2.1,<4"
xarray = ">=2026.4,<2027"
marimo = ">=0.23,<0.24"
altair = ">=6,<7"
pillow = ">=12,<13"
numpy = "<2.5.2"
libgfortran5 = "!=13.2.0"
python = ">=3.13"
vegafusion = ">=2.0.2,<3"
vegafusion-python-embed = ">=1.6.9,<2"
vl-convert-python = ">=1.7.0,<2"
pyarrow = ">=24,<25"
fastapi = ">=0.141,<0.142"
granian = ">=2.7,<3"
matplotlib-base = ">=3.10.8,<4"
scipy = ">=1.15.2,<2"
requests = ">=2.32.5,<3"
pydantic = ">=2.12"
httpx2 = ">=2.5.0,<3"
sentry-sdk = ">=2.66,<3"
pint = ">=0.25.3,<0.26"

[tool.pixi.environments]
test = { features = [ "test" ], solve-group = "default" }

[tool.pixi.feature.test.dependencies]
pytest = ">=9"
pytest-playwright = ">=0.7,<1"
# Records the Buoy Barn and ERDDAP traffic the unit tests need into cassettes,
# so they exercise the real request and response shapes without the network.
pytest-recording = ">=0.13,<1"
# conda-forge splits playwright into the node driver (playwright) and the Python
# bindings (playwright-python), and they must move together. Constraining only
# the driver let exclude-newer pull bindings 1.61 against driver 1.60 during
# lock-file maintenance, which fails every browser assertion instantly with an
# empty message. Keep both bounds identical, and see renovate.json for the
# grouping that stops them being bumped apart.
playwright = ">=1.62,<1.63"
playwright-python = ">=1.62,<1.63"

[tool.pixi.feature.test.tasks]
unit = "pytest tests/unit"
# Each cassette has to be recorded in its own pytest process -- see the module
# docstring in tests/record_cassettes.py.
unit-rerecord = "python tests/record_cassettes.py"
unit-record-new = "python tests/record_cassettes.py --new-only"
e2e = "pytest tests/e2e --browser chromium --screenshot only-on-failure --tracing retain-on-failure"
e2e-install = "playwright install chromium"
e2e-docker = "E2E_BASE_URL=http://localhost:8080 pixi run e2e"
e2e-browser = "pixi run e2e --headed"
e2e-codegen = "playwright codegen"

[tool.pixi.feature.test.tasks.e2e-trace]
args = [ "trace_path" ]
cmd = "playwright show-trace {{trace_path}}"

[tool.pixi.tasks]
edit = "marimo edit"
app = "marimo run climatology.py"

# Granian ignores SIGTERM, and binds with SO_REUSEPORT so a second `pixi run
# serve` on the same port doesn't fail to bind -- it silently shares the port
# with the stale one instead, splitting requests between them and making the
# app merely look hung. Uses `-sTCP:LISTEN` as a bare port match (e.g. `lsof
# -ti:PORT` without it) also matches other processes' client connections to
# the app -- a browser tab with the page open, say -- and killing those is
# not what "clean up old servers" means.
[tool.pixi.tasks.kill-server]
args = [ { arg = "port", default = "8080" } ]
cmd = "kill -9 $(lsof -nP -iTCP:{{ port }} -sTCP:LISTEN -t 2>/dev/null) 2>/dev/null || true"
description = "Kill any process listening on the given port, if any. Useful for cleaning up old servers before starting a new one."

# granian serves public/ itself, so requests for the logo never reach the app.
# The route is absolute so it resolves identically from every sub-mounted
# marimo app; see common.py's sidebar_menu().
#
# The route is /static rather than /public even though the directory is
# public/: granian matches the route as a plain string prefix, not on path
# segments, so /public would also swallow marimo's own /public-files-sw.js
# (and anything else starting with those characters) and 404 it.
#
# host and port are arguments so the e2e suite can bind a free port on
# localhost without restating the static options -- see tests/e2e/conftest.py.
#
# granian disables the access log by default, unlike uvicorn. Keep it on: the
# container log is the only view of what the app was asked for when an e2e run
# fails. Note it still records nothing for /public, which granian answers
# without entering the app -- tests/e2e/test_pages.py covers those instead.
[tool.pixi.tasks.serve]
args = [
  { arg = "host", default = "0.0.0.0" },
  { arg = "port", default = "8080" },
]
cmd = """\
  granian --interface asgi --host {{ host }} --port {{ port }} --access-log --static-path-route /static \
  --static-path-mount public app:app --workers-kill-timeout 5\
  """
description = "Serve the app on the given host and port, with /static routed to public/."

[tool.pixi.workspace]
channels = [ "conda-forge" ]
platforms = [ "linux-64", "osx-arm64" ]
exclude-newer = "7d"

[tool.ruff.lint]
extend-select = [
  "ARG", # flake8-unused-arguments
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "EM",  # flake8-errmsg
  "EXE", # flake8-executable
  "G",   # flake8-logging-format
  "I",   # isort
  "ICN", # flake8-import-conventions
  "NPY", # NumPy specific rules
  "PD",  # pandas-vet
  "PGH", # pygrep-hooks
  "PIE", # flake8-pie
  "PL",  # pylint
  "PT",  # flake8-pytest-style
  "PTH", # flake8-use-pathlib
  "RET", # flake8-return
  "RUF", # Ruff-specific
  "SIM", # flake8-simplify
  "UP",  # pyupgrade
  "YTT", # flake8-2020
]
ignore = [
  "B018",    # marimo: last expression in a cell renders output
  "ISC001",  # conflicts with formatter
  "PLC0415", # marimo: imports live inside cells
  "PLR09",   # too many X
  "PLR2004", # magic values
]

[tool.repo-review]
ignore = [
  "PY004", # docs folder
  "PP002", # build-system table
  "PP003", # wheel as build dep
  "PP006", # dev dependency group
  "GH200", # Using renovate rather than dependabot
  "MY100", # MyPy
  "PC111", # Blacken docs
  "PC140", # Type checking
  "PC901", # pre-commit update message
  "PC902", # pre-comit auto-fix message
  "PC903", # pre-commit schedule
]

[tool.pyproject-fmt]
table_format = "long"
sub_table_spacing = "\n"

[tool.pytest]
addopts = [ "--verbose", "-ra", "--strict-markers", "--strict-config" ]
filterwarnings = [ "error" ]
log_level = "INFO"
minversion = "9"
# The app is a set of top-level modules rather than a package, so the unit tests
# import them from the repository root.
pythonpath = [ "." ]
strict = true
testpaths = [ "tests" ]

[tool.marimo.display]
custom_css = [ "style.css" ]
